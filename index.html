<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Reading Night — Multilingual Books</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background:#f6f7f9; color:#111; }
    header { background:#fff; border-bottom:1px solid #e5e7eb; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 18px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 6px 0; color:#444; }
    .small { font-size: 13px; color:#666; margin-top: 8px; }
    .controls { display:grid; gap:12px; grid-template-columns: 1fr; margin-top: 14px; }
    .searchrow { display:grid; gap:10px; grid-template-columns: 1fr; }
    input { width:100%; padding:10px 12px; border-radius:12px; border:1px solid #d1d5db; font-size: 14px; }
    .barlabel { font-weight:800; font-size: 13px; color:#333; margin-top: 4px; }
    .langbar, .agebar { display:flex; flex-wrap: wrap; gap:10px; margin-top: 6px; }
    button.btn {
      border: 1px solid #111;
      background: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn.active { background:#111; color:#fff; }
    .grid { display:grid; gap:14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 16px; }
    .card {
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 1px 2px rgba(0,0,0,.05);
      display:flex;
      flex-direction:column;
    }
    .cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #f1f5f9;
      display:block;
    }
    .cardbody { padding: 12px 14px 14px; display:flex; flex-direction:column; gap:8px; }
    .pair { display:inline-block; font-size:12px; background:#eef2ff; color:#3730a3; padding:4px 8px; border-radius:999px; width: fit-content; }
    .agepill { display:inline-block; font-size:12px; background:#ecfeff; color:#155e75; padding:4px 8px; border-radius:999px; width: fit-content; }
    .title { font-weight: 900; line-height: 1.2; }
    .meta { font-size: 13px; color:#555; }
    .btnrow { display:flex; gap:10px; flex-wrap:wrap; margin-top: 4px; }
    a.linkbtn { text-decoration:none; padding:10px 12px; border-radius:12px; border:1px solid #111; font-weight:800; font-size:14px; }
    a.primary { background:#111; color:#fff; }
    .rtl { direction: rtl; text-align: right; }
    footer { text-align:center; padding:18px; color:#666; font-size: 13px; }
    @media (max-width: 640px){
      button.btn { flex: 1 1 auto; }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1>Family Reading Night — Multilingual Book List</h1>

    <div id="instructions"></div>
    <div class="small">This website does not sell books or process payments. “Buy” buttons open Amazon in a new tab.</div>

    <div class="controls">
      <div>
        <div class="barlabel">Language</div>
        <div class="langbar" id="langbar"></div>
      </div>

      <div>
        <div class="barlabel">Age</div>
        <div class="agebar" id="agebar"></div>
      </div>

      <div class="searchrow">
        <input id="search" placeholder="Search by title or ISBN…" />
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="grid" class="grid"></div>
</main>

<footer>© <span id="year"></span></footer>

<script>
  const instructionsByLang = {
    "All": {
      html: `
        <p><b>Choose a language</b> and <b>choose an age</b>. You’ll see books that match your selections.</p>
        <p>Tap a cover or click <b>Buy on Amazon</b> to purchase.</p>
      `,
      rtl: false
    },
    "English": {
      html: `
        <p><b>Choose your language</b> and <b>choose an age</b>. You’ll see books that match your selections.</p>
        <p>Tap a cover or click <b>Buy on Amazon</b> to purchase.</p>
      `,
      rtl: false
    },
    "Spanish": {
      html: `
        <p><b>Elige tu idioma</b> y <b>elige una edad</b>. Verás libros que coinciden con tus selecciones.</p>
        <p>Toca la portada o haz clic en <b>Comprar en Amazon</b> para comprar.</p>
      `,
      rtl: false
    },
    "Arabic": {
      html: `
        <p><b>اختر لغتك</b> و<b>اختر العمر</b>. ستظهر لك كتب مناسبة لاختياراتك.</p>
        <p>اضغط على الغلاف أو زر <b>الشراء من أمازون</b> للشراء.</p>
      `,
      rtl: true
    },
    "Haitian Creole": {
      html: `
        <p><b>Chwazi lang ou</b> epi <b>chwazi laj</b>. W ap wè liv ki mache ak chwa w yo.</p>
        <p>Touche kouvèti a oswa klike <b>Achte sou Amazon</b> pou achte.</p>
      `,
      rtl: false
    },
    "French": {
      html: `
        <p><b>Choisissez votre langue</b> et <b>choisissez l’âge</b>. Vous verrez des livres qui correspondent à vos choix.</p>
        <p>Appuyez sur la couverture ou cliquez sur <b>Acheter sur Amazon</b> pour acheter.</p>
      `,
      rtl: false
    },
    "Portuguese": {
      html: `
        <p><b>Escolha seu idioma</b> e <b>escolha a idade</b>. Você verá livros que correspondem às suas seleções.</p>
        <p>Toque na capa ou clique em <b>Comprar na Amazon</b> para comprar.</p>
      `,
      rtl: false
    }
  };

  const books = [
    { title: "Bear About Town", languages: ["English", "Haitian Creole"], isbn13: "9798888594179", age: "3+", coverUrl: "" },
    { title: "The Mexiglish Girl/La Chica Mexiglish", languages: ["English", "Spanish"], isbn13: "9781739937706", age: "0+", coverUrl: "" },
    { title: "Diario Del Wimpy Kid", languages: ["Spanish"], isbn13: "9781644735046", age: "7+", coverUrl: "" },
    { title: "Seeds in a Dark Fruit Sky: Short Stories from Haiti", languages: ["English", "Haitian Creole"], isbn13: "9781733087308", age: "0+", coverUrl: "" },
    { title: "مذكرات طالب - قوانين االخ rules (Arabic Edition)", languages: ["Arabic"], isbn13: "9786140105164", age: "7+", coverUrl: "" },
    { title: "Sadiq Collection by Siman Nuurali 8 Books Collection Set", languages: ["English"], isbn13: "9781398207196", age: "7+", coverUrl: "" },
    { title: "Jet the Cat (Is Not a Cat)", languages: ["Arabic", "English"], isbn13: "9798888594360", age: "3+", coverUrl: "" },
    { title: "Diary Of A Wimpy Kid", languages: ["Arabic"], isbn13: "9786140101630", age: "7+", coverUrl: "" },
    { title: "Summer with Grandpa - جدي مع الصيف", languages: ["Arabic", "English"], isbn13: "9798396329348", age: "3+", coverUrl: "" },
    { title: "The Rainbow Fish/El Pez Arcoíris English/Spanish", languages: ["English", "Spanish"], isbn13: "9780735843714", age: "3+", coverUrl: "" },
    { title: "The Rainbow Fish English/Arabic", languages: ["Arabic", "English"], isbn13: "9780735843721", age: "3+", coverUrl: "" },
    { title: "Nelly’s Box - نيللي صندوق", languages: ["Arabic", "English"], isbn13: "9798846644175", age: "3+", coverUrl: "" },
    { title: "The Cat in the Hat in English and French", languages: ["English", "French"], isbn13: "9780394801711", age: "3+", coverUrl: "" },
    { title: "Amanda and the Lost Time", languages: ["English", "French"], isbn13: "9781525953231", age: "3+", coverUrl: "" },
    { title: "Summer with Grandpa - Verão com o Avô", languages: ["English", "Portuguese"], isbn13: "9798395782021", age: "3+", coverUrl: "" },
    { title: "Happy within / Feliz por dentro", languages: ["English", "Portuguese"], isbn13: "9781916395633", age: "3+", coverUrl: "" },
    { title: "Nelly’s Box - A Caixa da Nelly", languages: ["English", "Portuguese"], isbn13: "9798844533815", age: "3+", coverUrl: "" },
    { title: "Nelly’s Box - La boîte de Nelly", languages: ["English", "French"], isbn13: "9798844165948", age: "3+", coverUrl: "" },
    { title: "Nelly’s Box - La caja de Nelly", languages: ["English", "Spanish"], isbn13: "9798844119545", age: "3+", coverUrl: "" },
    { title: "La ley de Rodrick / Rodrick Rules", languages: ["Spanish"], isbn13: "9781644735053", age: "7+", coverUrl: "" },
    { title: "In Search of the Secret Gate - En Busca de la Entrada Secreta", languages: ["English", "Spanish"], isbn13: "9798378662968", age: "7+", coverUrl: "" },
    { title: "Summer with Grandpa - Verano con el abuelo", languages: ["English", "Spanish"], isbn13: "9798395381347", age: "3+", coverUrl: "" },
    { title: "The House on the Cliff: English-Spanish Dual Language Edition", languages: ["English", "Spanish"], isbn13: "9798989403172", age: "7+", coverUrl: "" },
    { title: "The Tower Treasure: English-Spanish Dual Language Edition", languages: ["English", "Spanish"], isbn13: "9798989403158", age: "7+", coverUrl: "" },
    { title: "I Took the Moon for a Walk", languages: ["English", "Haitian Creole"], isbn13: "9798888597613", age: "3+", coverUrl: "" },
    { title: "Not For Mimi/Pa Pou Mimi", languages: ["English", "Haitian Creole"], isbn13: "9798988863915", age: "3+", coverUrl: "" },
    { title: "Mwen reve I dream too", languages: ["English", "Haitian Creole"], isbn13: "9781626322301", age: "3+", coverUrl: "" },
    { title: "Learn Haitian Creole For Kids", languages: ["English", "Haitian Creole"], isbn13: "9798873981618", age: "3+", coverUrl: "" },
    { title: "Lili, Mommy and Our House", languages: ["English", "Haitian Creole"], isbn13: "9798355883980", age: "3+", coverUrl: "" },
    { title: "Lili, Tati, And The Zoo", languages: ["English", "Haitian Creole"], isbn13: "9798411903683", age: "3+", coverUrl: "" },
    { title: "Lili, Grandma, and Legume", languages: ["English", "Haitian Creole"], isbn13: "9798778168954", age: "3+", coverUrl: "" },
    { title: "Harry Potter y la piedra filosofal", languages: ["Spanish"], isbn13: "9788478884452", age: "12+", coverUrl: "" },
    { title: "Percy Jackson y el ladrón del rayo", languages: ["Spanish"], isbn13: "9788498386264", age: "12+", coverUrl: "" },
    { title: "Los juegos del hambre", languages: ["Spanish"], isbn13: "9788427202136", age: "12+", coverUrl: "" },
    { title: "Divergente", languages: ["Spanish"], isbn13: "9788427201917", age: "12+", coverUrl: "" },
    { title: "El hobbit", languages: ["Spanish"], isbn13: "9788445071994", age: "12+", coverUrl: "" },
    { title: "هاري بوتر وحجر الفيلسوف", languages: ["Arabic"], isbn13: "9789953891717", age: "12+", coverUrl: "" },
    { title: "بيرسي جاكسون وسارق البرق", languages: ["Arabic"], isbn13: "9789953895234", age: "12+", coverUrl: "" },
    { title: "ألعاب الجوع", languages: ["Arabic"], isbn13: "9789953896972", age: "12+", coverUrl: "" },
    { title: "سيد الخواتم: رفقة الخاتم", languages: ["Arabic"], isbn13: "9789953893032", age: "12+", coverUrl: "" },
    { title: "Dezafi", languages: ["Haitian Creole"], isbn13: "9780913447624", age: "12+", coverUrl: "" },
    { title: "Ti Zwazo", languages: ["Haitian Creole"], isbn13: "9789997013246", age: "12+", coverUrl: "" }
  ];

  const languageButtons = ["All", "English", "Spanish", "Arabic", "Haitian Creole", "French", "Portuguese"];
  const ageButtons = ["0+", "3+", "7+", "12+"];

  let selectedLang = "All";
  let selectedAge = "12+";

  const langbar = document.getElementById("langbar");
  const agebar = document.getElementById("agebar");
  const grid = document.getElementById("grid");
  const search = document.getElementById("search");
  const instructions = document.getElementById("instructions");

  function ageToNum(a) {
    return parseInt(String(a).replace("+", ""), 10);
  }

  function amazonLinkFromISBN(isbn13) {
    return `https://www.amazon.com/s?k=${encodeURIComponent(isbn13)}`;
  }

  function openLibraryCover(isbn13) {
    return `https://covers.openlibrary.org/b/isbn/${encodeURIComponent(isbn13)}-L.jpg`;
  }

  async function googleBooksCover(isbn13) {
    try {
      const url = `https://www.googleapis.com/books/v1/volumes?q=isbn:${encodeURIComponent(isbn13)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.items || !data.items.length) return null;
      const links = data.items[0]?.volumeInfo?.imageLinks;
      return links?.thumbnail || links?.smallThumbnail || null;
    } catch (e) {
      return null;
    }
  }

  function placeholderCover(title) {
    return `https://placehold.co/400x600?text=${encodeURIComponent(title || "Book Cover")}`;
  }

  async function loadBestCover(img, book) {
    if (book.coverUrl && book.coverUrl.trim() !== "") {
      img.src = book.coverUrl;
      img.onerror = async () => {
        const gb = await googleBooksCover(book.isbn13);
        if (gb) {
          img.onerror = () => { img.src = placeholderCover(book.title); };
          img.src = gb;
          return;
        }
        tryOpenLibrary(img, book);
      };
      return;
    }

    const gb = await googleBooksCover(book.isbn13);
    if (gb) {
      img.onerror = () => { tryOpenLibrary(img, book); };
      img.src = gb;
      return;
    }

    tryOpenLibrary(img, book);
  }

  function tryOpenLibrary(img, book) {
    const ol = openLibraryCover(book.isbn13);
    const testImg = new Image();

    testImg.onload = () => {
      img.onerror = () => { img.src = placeholderCover(book.title); };
      img.src = ol;
    };

    testImg.onerror = () => {
      img.src = placeholderCover(book.title);
    };

    testImg.src = ol;
  }

  function renderInstructions() {
    const obj = instructionsByLang[selectedLang] || instructionsByLang["All"];
    instructions.className = obj.rtl ? "rtl" : "";
    instructions.innerHTML = obj.html;
  }

  function buildLanguageButtons() {
    langbar.innerHTML = "";
    languageButtons.forEach(l => {
      const btn = document.createElement("button");
      btn.className = "btn" + (l === selectedLang ? " active" : "");
      btn.type = "button";
      btn.textContent =
        l === "All" ? "All" :
        l === "Spanish" ? "Español" :
        l === "Arabic" ? "العربية" :
        l === "Haitian Creole" ? "Kreyòl" :
        l === "French" ? "Français" :
        l === "Portuguese" ? "Português" : l;

      btn.addEventListener("click", () => {
        selectedLang = l;
        buildLanguageButtons();
        renderInstructions();
        render();
      });

      langbar.appendChild(btn);
    });
  }

  function buildAgeButtons() {
    agebar.innerHTML = "";
    ageButtons.forEach(a => {
      const btn = document.createElement("button");
      btn.className = "btn" + (a === selectedAge ? " active" : "");
      btn.type = "button";
      btn.textContent = a;

      btn.addEventListener("click", () => {
        selectedAge = a;
        buildAgeButtons();
        render();
      });

      agebar.appendChild(btn);
    });
  }

  function render() {
    const q = search.value.trim().toLowerCase();
    const selectedAgeNum = ageToNum(selectedAge);

    const filtered = books.filter(b => {
      const matchesLang = selectedLang === "All" || (b.languages || []).includes(selectedLang);
      const bookMin = ageToNum(b.age || "0+");
      const matchesAge = bookMin <= selectedAgeNum;
      const hay = `${b.title} ${(b.languages || []).join(" ")} ${b.isbn13} ${b.age}`.toLowerCase();
      const matchesQ = !q || hay.includes(q);
      return matchesLang && matchesAge && matchesQ;
    });

    grid.innerHTML = "";

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="card"><div class="cardbody">No matches. Try a different search, language, or age.</div></div>`;
      return;
    }

    filtered.forEach(b => {
      const pairLabel = (b.languages || []).join(" + ");
      const link = amazonLinkFromISBN(b.isbn13);

      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.className = "cover";
      img.alt = `Cover of ${b.title}`;
      img.loading = "lazy";
      img.style.cursor = "pointer";
      img.src = placeholderCover(b.title);
      img.addEventListener("click", () => window.open(link, "_blank", "noopener,noreferrer"));

      loadBestCover(img, b);

      const body = document.createElement("div");
      body.className = "cardbody";
      body.innerHTML = `
        <div class="pair">${pairLabel || "Language"}</div>
        <div class="agepill">Ages ${b.age || "0+"}</div>
        <div class="title">${b.title}</div>
        <div class="meta">ISBN-13: ${b.isbn13}</div>
        <div class="btnrow">
          <a class="linkbtn primary" href="${link}" target="_blank" rel="noopener noreferrer">Buy on Amazon</a>
        </div>
      `;

      card.appendChild(img);
      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  document.getElementById("year").textContent = new Date().getFullYear();
  buildLanguageButtons();
  buildAgeButtons();
  renderInstructions();
  search.addEventListener("input", render);
  render();
</script>
</body>
</html>
