<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background:#f6f7f9; color:#111; }
    header { background:#fff; border-bottom:1px solid #e5e7eb; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 18px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 6px 0; color:#444; }
    .small { font-size: 13px; color:#666; margin-top: 8px; }
    .controls { display:grid; gap:12px; grid-template-columns: 1fr; margin-top: 14px; }
    .searchrow { display:grid; gap:10px; grid-template-columns: 2fr 1fr; }
    input { width:100%; padding:10px 12px; border-radius:12px; border:1px solid #d1d5db; font-size: 14px; }
    .langbar { display:flex; flex-wrap: wrap; gap:10px; margin-top: 6px; }
    button.langbtn {
      border: 1px solid #111;
      background: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    button.langbtn.active { background:#111; color:#fff; }
    .grid { display:grid; gap:14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 16px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:18px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.05); display:flex; flex-direction:column; }
    .cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #f1f5f9;
    }
    .cardbody { padding: 12px 14px 14px; display:flex; flex-direction:column; gap:8px; }
    .pair { display:inline-block; font-size:12px; background:#eef2ff; color:#3730a3; padding:4px 8px; border-radius:999px; width: fit-content; }
    .title { font-weight: 900; line-height: 1.2; }
    .meta { font-size: 13px; color:#555; }
    .btnrow { display:flex; gap:10px; flex-wrap:wrap; margin-top: 4px; }
    a.btn { text-decoration:none; padding:10px 12px; border-radius:12px; border:1px solid #111; font-weight:800; font-size:14px; }
    a.primary { background:#111; color:#fff; }
    .rtl { direction: rtl; text-align: right; }
    footer { text-align:center; padding:18px; color:#666; font-size: 13px; }
    @media (max-width: 640px){
      .searchrow { grid-template-columns: 1fr; }
      button.langbtn { flex: 1 1 auto; }
    }
  </style>
</head>

    </div>

</header>

  // ===== 3) UI LOGIC =====
  const languageButtons = ["All", "English", "Spanish", "Arabic", "Haitian Creole", "French", "Portuguese"];

  let selectedLang = "All";

  const langbar = document.getElementById("langbar");
  const grid = document.getElementById("grid");
  const search = document.getElementById("search");
  const instructions = document.getElementById("instructions");

  function amazonLinkFromISBN(isbn13) {
    // Reliable + simple: search by ISBN
    return `https://www.amazon.com/s?k=${encodeURIComponent(isbn13)}`;
  }

  function renderInstructions() {
    const obj = instructionsByLang[selectedLang] || instructionsByLang["All"];
    instructions.className = obj.rtl ? "rtl" : "";
    instructions.innerHTML = obj.html;
  }

  function buildButtons() {
    langbar.innerHTML = "";
    languageButtons.forEach(l => {
      const btn = document.createElement("button");
      btn.className = "langbtn" + (l === selectedLang ? " active" : "");
      btn.type = "button";
      btn.textContent =
        l === "All" ? "All / Tout / Todo" :
        l === "Spanish" ? "Español" :
        l === "Arabic" ? "العربية" :
        l === "Haitian Creole" ? "Kreyòl" :
        l === "French" ? "Français" :
        l === "Portuguese" ? "Português" : l;

      btn.addEventListener("click", () => {
        selectedLang = l;
        buildButtons();
        renderInstructions();
        render();
      });
      langbar.appendChild(btn);
    });
  }

  function render() {
    const q = search.value.trim().toLowerCase();

    const filtered = books.filter(b => {
      const matchesLang = (selectedLang === "All") || b.languages.includes(selectedLang);
      const hay = `${b.title} ${b.languages.join(" ")} ${b.isbn13}`.toLowerCase();
      const matchesQ = !q || hay.includes(q);
      return matchesLang && matchesQ;
    });

    grid.innerHTML = "";
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="card"><div class="cardbody">No matches. Try a different search or language.</div></div>`;
      return;
    }

    filtered.forEach(b => {
      const pairLabel = b.languages.join(" + ");
      const link = amazonLinkFromISBN(b.isbn13);

      const card = document.createElement("div");
      card.className = "card";

      // Cover image: hide if it fails to load
      const img = document.createElement("img");
      img.className = "cover";
      img.src = b.image;
      img.alt = `Cover of ${b.title}`;
      img.loading = "lazy";
      img.onerror = () => { img.style.display = "none"; };

      const body = document.createElement("div");
      body.className = "cardbody";
      body.innerHTML = `
        <div class="pair">${pairLabel}</div>
        <div class="title">${b.title}</div>
        <div class="meta">ISBN-13: ${b.isbn13}</div>
        <div class="btnrow">
          <a class="btn primary" href="${link}" target="_blank" rel="noopener noreferrer">Buy on Amazon</a>
        </div>
      `;

      // Make image clickable too
      img.style.cursor = "pointer";
      img.addEventListener("click", () => window.open(link, "_blank", "noopener,noreferrer"));

      card.appendChild(img);
      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  document.getElementById("year").textContent = new Date().getFullYear();
  buildButtons();
  renderInstructions();
  search.addEventListener("input", render);
  render();
